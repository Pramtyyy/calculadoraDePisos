<!DOCTYPE html>
<html lang="en">
    <link rel="stylesheet" href="style.css">
    <script src="teste.js" defer></script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculador de Pisos</title>
</head>
<body>
    <div>
        <dialog id="modal">
            <form id="pisosForm">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>

            <label for="altura">Altura:</label>
            <input type="number" id="altura" name="altura" required>

            <label for="largura">Largura:</label>
            <input type="number" id="largura" name="largura" required>

            <label for="cor">Cor:</label>
            <input type="text" id="cor" name="cor" required>

            <label for="textura">Textura:</label>
            <select id="textura" name="textura" required>
                <option value="brilhante">Brilhante</option>
                <option value="polido">Polido</option>
                <option value="acetinado">Acetinado</option>
                <option value="antiderrapante">Antiderrapante</option>
            </select>

            <label for="resistencia">Resistência:</label>
            <select id="resistencia" name="resistencia" required>
                <option value="LA">LA</option>
                <option value="LB">LB</option>
                <option value="LC">LC</option>
                <option value="LD">LD</option>
                <option value="LE">LE</option>
                <option value="LF">LF</option>
            </select>

            <label for="caixa">Metros por caixa:</label>
            <input type="number" id="caixa" name="caixa" min="0.01" step="0.01" required>

            <label for="preco">Preço por m²:</label>
            <input type="number" id="preco" name="preco" min="0" step="0.01" required>

            <label for="estoque">Estoque (caixas):</label>
            <input type="number" id="estoque" name="estoque" min="0" step="1" required>

                <button type="submit" id="salvarPiso">Adicionar</button>
                <button type="button" id="fecharFormulario">Fechar</button>
            </form>
        </dialog>

        <button type="button" id="abrirFormulario">Adicionar Piso</button>
        <button type="button" id="limparPisos">Limpar pisos</button>
        <ul id="listaPisos"></ul>
    </div>

    <div>
        <dialog id="modalDetalhes">
            <pre id="detalhesPiso"></pre>
            <button type="button" id="editarPiso">Editar</button>
            <button type="button" id="venderPiso">Vender</button>
            <button type="button" id="fecharDetalhes">Fechar</button>
        </dialog>
    </div>

    <dialog id="modalVenda">
        <form id="vendaForm">
            <h2>Completar venda</h2>
            <p id="produtoVenda"></p>
            <p>Preço por m²: <strong id="precoUnitario"></strong></p>
            <p>Metros por caixa: <strong id="metrosPorCaixa"></strong></p>
            <label for="quantidadeVenda">Quantidade de caixas:</label>
            <input type="number" id="quantidadeVenda" min="1" step="1" required>
            <p>Metros vendidos: <strong id="metrosVendidos"></strong></p>
            <p>Valor total: <strong id="valorTotal"></strong></p>
            <button type="submit">Confirmar venda</button>
            <button type="button" id="fecharVenda">Cancelar</button>
        </form>
    </dialog>
</body>
</html>
